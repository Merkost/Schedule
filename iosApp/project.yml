name: Schedule

options:
  bundleIdPrefix: ru.dvfu.appliances
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.0"
  generateInfoPlist: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.14.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  Schedule:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: iosApp
        type: group
        excludes:
          - "Info.plist"
          - "iosApp.entitlements"
      - path: iosApp/Info.plist
        buildPhase: none
      - path: iosApp/iosApp.entitlements
        buildPhase: none

    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default

    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: ru.dvfu.appliances
        PRODUCT_NAME: Schedule
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - ComposeApp
        ENABLE_BITCODE: NO

    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebasePerformance
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn

    preBuildScripts:
      - name: "Compile Kotlin & embed ComposeApp framework"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          ./gradlew :composeApp:generateComposeResClass :composeApp:embedAndSignAppleFrameworkForXcode
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/ComposeApp.framework

    postBuildScripts:
      - name: "Upload dSYMs to Crashlytics"
        basedOnDependencyAnalysis: false
        path: scripts/upload_dsyms.sh

schemes:
  Schedule:
    build:
      targets:
        Schedule: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
